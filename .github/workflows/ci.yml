name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r gaveteiro/backend/requirements.txt
      - run: pytest -q
        working-directory: gaveteiro/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
        working-directory: gaveteiro/frontend
      - run: npm run build
        working-directory: gaveteiro/frontend

  addon-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar a estrutura do add-on
        uses: home-assistant/actions/hassfest@master
        continue-on-error: true
      - name: Conferir se o config.yaml é YAML válido
        run: python -c "import yaml,sys; yaml.safe_load(open('gaveteiro/config.yaml')); yaml.safe_load(open('repository.yaml'))"
