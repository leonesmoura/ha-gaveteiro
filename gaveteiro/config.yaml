name: Gaveteiro
version: "1.5.0"
slug: gaveteiro
description: Controle de estoque de componentes eletrônicos com gaveteiro interativo
url: https://github.com/leonesmoura/ha-gaveteiro
arch:
  - aarch64
  - amd64
init: false

# Painel na barra lateral do Home Assistant (já autenticado pelo HA).
ingress: true
ingress_port: 8099
panel_icon: mdi:file-cabinet
panel_title: Gaveteiro

# Acesso direto pela LAN: http://IP-DO-HAOS:8099 (exige o login abaixo).
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Acesso direto pelo navegador (fora do Home Assistant)

# O banco fica em /share para o add-on SQLite Web conseguir abrir o arquivo.
map:
  - share:rw

options:
  username: admin
  password: troque-esta-senha
  image_max_size: 800

schema:
  username: str
  password: password
  image_max_size: int(200,2000)
